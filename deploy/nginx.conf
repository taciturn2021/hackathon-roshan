# Same origin for the app and the API, so the browser needs no CORS and the WebSocket origin check passes.
server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 25m;   # voice notes and photos (the API caps uploads at 20 MiB)

  location = /api/ws {
    proxy_pass http://api:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;   # inline AI calls (onboarding, problem classification)
  }

  location /media/ {
    proxy_pass http://api:8080;
  }

  location / {
    try_files $uri /index.html;   # single-page app
  }
}
