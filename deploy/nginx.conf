# Same origin for the app and the API, so the browser needs no CORS and the WebSocket origin check passes.
server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 25m;   # voice notes and photos (the API caps uploads at 20 MiB)

  # Re-resolve the api through Docker's DNS on each request; a static proxy_pass would keep the
  # old container IP after the api is recreated and return 502 until nginx restarts.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api:8080;

  location = /api/ws {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;   # inline AI calls (onboarding, problem classification)
  }

  location /media/ {
    proxy_pass $api;
  }

  location / {
    try_files $uri /index.html;   # single-page app
  }
}
